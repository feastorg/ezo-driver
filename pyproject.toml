[build-system]
requires = ["setuptools>=77", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name = "ezo-driver"
version = "0.5.1"
description = "Linux Python bindings for ezo-driver"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ezo-driver maintainers" }]
dependencies = ["cffi>=1.16"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/feastorg/ezo-driver"
Issues = "https://github.com/feastorg/ezo-driver/issues"

[tool.setuptools]
package-dir = {"" = "bindings/python/src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["bindings/python/src"]

[project.optional-dependencies]
test = ["pytest>=7", "setuptools"]

# One abi3 wheel per architecture, built on CPython 3.9 and tested inside the
# manylinux container, where the test extra and the image's compiler let the
# tests build tests/fakes/ from the project checkout.
[tool.cibuildwheel]
build = ["cp39-manylinux_x86_64", "cp39-manylinux_aarch64"]
test-extras = ["test"]
test-command = [
  "python -c \"import ezo_driver; assert 'site-packages' in ezo_driver.__file__, ezo_driver.__file__\"",
  "EZO_DRIVER_SOURCE_DIR={project} python -m pytest {project}/bindings/python/tests -q",
]
