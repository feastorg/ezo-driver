name: Full Validation

on:
  push:
    branches:
      - main
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  host-linux-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset host-linux-debug

      - name: Build
        run: cmake --build --preset host-linux-debug --parallel

      - name: Test
        run: ctest --preset host-linux-debug

  host-linux-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset host-linux-release

      - name: Build
        run: cmake --build --preset host-linux-release --parallel

      - name: Test
        run: ctest --preset host-linux-release

      - name: Install to staging
        run: cmake --install build/host-linux-release --prefix "${{ github.workspace }}/staging"

      - name: Consumer smoke test
        run: |
          mkdir -p build/smoke
          cat > build/smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ezo_driver_smoke C)
          find_package(ezo_driver CONFIG REQUIRED)
          add_executable(smoke main.c)
          target_link_libraries(smoke PRIVATE ezo::ezo_core)
          EOF
          cat > build/smoke/main.c <<'EOF'
          #include <ezo.h>
          #include <ezo_i2c.h>
          int main(void) { return 0; }
          EOF
          cmake -S build/smoke -B build/smoke/out \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging"
          cmake --build build/smoke/out --parallel

      - name: Package install tree
        run: tar -czf ezo-driver-install-tree.tar.gz -C "${{ github.workspace }}/staging" .

  host-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: host-windows-debug
            configuration: Debug
          - preset: host-windows-release
            configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.configuration }}

  python-bindings:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist, then a wheel from the sdist
        run: |
          python -m pip install build twine
          python -m build --outdir dist

      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          tar -tzf dist/*.tar.gz | grep -q '/LICENSE$'
          python -m zipfile -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'

      - name: Install the wheel with the test extra
        run: python -m pip install "$(echo dist/*.whl)[test]"

      - name: Run Python bindings tests against the installed wheel
        env:
          # The tests compile tests/fakes/ into a test-only module from here.
          EZO_DRIVER_SOURCE_DIR: ${{ github.workspace }}
        run: |
          cp -r bindings/python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import ezo_driver; assert 'site-packages' in ezo_driver.__file__, ezo_driver.__file__"
          python -m pytest tests -q

  arduino-uno-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BOARD: uno
      SKETCHES: |
        examples/arduino/i2c/raw/smoke/smoke.ino
        examples/arduino/i2c/commissioning/inspect_device/inspect_device.ino
        examples/arduino/i2c/typed/read_ph/read_ph.ino
        examples/arduino/i2c/typed/read_orp/read_orp.ino
        examples/arduino/i2c/typed/read_ec/read_ec.ino
        examples/arduino/i2c/typed/read_do/read_do.ino
        examples/arduino/i2c/typed/read_rtd/read_rtd.ino
        examples/arduino/i2c/typed/read_hum/read_hum.ino
        examples/arduino/i2c/advanced/ph_calibration/ph_calibration.ino
        examples/arduino/i2c/advanced/orp_calibration/orp_calibration.ino
        examples/arduino/i2c/advanced/ec_calibration/ec_calibration.ino
        examples/arduino/i2c/advanced/do_calibration/do_calibration.ino
        examples/arduino/i2c/advanced/rtd_calibration/rtd_calibration.ino
        examples/arduino/i2c/advanced/hum_temperature_calibration/hum_temperature_calibration.ino
        examples/arduino/i2c/advanced/ph_workflow/ph_workflow.ino
        examples/arduino/i2c/advanced/orp_workflow/orp_workflow.ino
        examples/arduino/i2c/advanced/ec_workflow/ec_workflow.ino
        examples/arduino/i2c/advanced/do_workflow/do_workflow.ino
        examples/arduino/i2c/advanced/rtd_workflow/rtd_workflow.ino
        examples/arduino/i2c/advanced/hum_workflow/hum_workflow.ino
        examples/arduino/i2c/advanced/calibration_transfer/calibration_transfer.ino
        examples/arduino/i2c/advanced/control_workflow/control_workflow.ino
        examples/arduino/i2c/advanced/transport_switch/transport_switch.ino
        examples/arduino/i2c/advanced/ph_temp_comp_from_rtd/ph_temp_comp_from_rtd.ino
        examples/arduino/i2c/advanced/ec_temp_comp_from_rtd/ec_temp_comp_from_rtd.ino
        examples/arduino/i2c/advanced/do_salinity_comp_from_ec/do_salinity_comp_from_ec.ino
        examples/arduino/i2c/advanced/do_full_compensation_chain/do_full_compensation_chain.ino
        examples/arduino/uart/raw/smoke/smoke.ino
        examples/arduino/uart/commissioning/inspect_device/inspect_device.ino
        examples/arduino/uart/typed/read_ph/read_ph.ino
        examples/arduino/uart/typed/read_orp/read_orp.ino
        examples/arduino/uart/typed/read_ec/read_ec.ino
        examples/arduino/uart/typed/read_do/read_do.ino
        examples/arduino/uart/typed/read_rtd/read_rtd.ino
        examples/arduino/uart/typed/read_hum/read_hum.ino
        examples/arduino/uart/advanced/control_workflow/control_workflow.ino
        examples/arduino/uart/advanced/transport_switch/transport_switch.ino
        examples/arduino/uart/advanced/calibration_transfer/calibration_transfer.ino
        examples/arduino/uart/advanced/multi_device_router/multi_device_router.ino

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ env.PLATFORMIO_VERSION }}-${{ env.BOARD }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio==${PLATFORMIO_VERSION}"

      - name: Compile Arduino library examples
        run: |
          while IFS= read -r sketch; do
            if [ -z "$sketch" ]; then
              continue
            fi

            echo "::group::${BOARD} ${sketch}"
            if PLATFORMIO_CI_SRC="${sketch}" pio ci --lib="." --board="${BOARD}"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              exit "${status}"
            fi
          done <<< "${SKETCHES}"

  arduino-esp32-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BOARD: esp32dev
      SKETCHES: |
        examples/arduino/uart/raw/smoke/smoke.ino
        examples/arduino/uart/commissioning/inspect_device/inspect_device.ino
        examples/arduino/uart/typed/read_ph/read_ph.ino
        examples/arduino/uart/typed/read_orp/read_orp.ino
        examples/arduino/uart/typed/read_ec/read_ec.ino
        examples/arduino/uart/typed/read_do/read_do.ino
        examples/arduino/uart/typed/read_rtd/read_rtd.ino
        examples/arduino/uart/typed/read_hum/read_hum.ino
        examples/arduino/uart/advanced/control_workflow/control_workflow.ino
        examples/arduino/uart/advanced/transport_switch/transport_switch.ino
        examples/arduino/uart/advanced/calibration_transfer/calibration_transfer.ino
        examples/arduino/uart/advanced/multi_device_router/multi_device_router.ino

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ env.PLATFORMIO_VERSION }}-${{ env.BOARD }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade "platformio==${PLATFORMIO_VERSION}"

      - name: Compile Arduino library examples
        run: |
          while IFS= read -r sketch; do
            if [ -z "$sketch" ]; then
              continue
            fi

            echo "::group::${BOARD} ${sketch}"
            if PLATFORMIO_CI_SRC="${sketch}" pio ci --lib="." --board="${BOARD}"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              exit "${status}"
            fi
          done <<< "${SKETCHES}"
