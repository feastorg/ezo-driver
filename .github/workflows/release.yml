name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Release (linux-x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential jq

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          expected = os.environ["RELEASE_VERSION"]
          checks = {}

          cmake_text = pathlib.Path("CMakeLists.txt").read_text()
          cmake_match = re.search(r"project\s*\([\s\S]*?\bVERSION\s+([^\s\)]+)", cmake_text)
          if not cmake_match:
            raise SystemExit("Could not find project VERSION in CMakeLists.txt")
          checks["CMakeLists.txt"] = cmake_match.group(1)

          pyproject_text = pathlib.Path("pyproject.toml").read_text()
          pyproject_match = re.search(r"(?m)^version\s*=\s*[\"']([^\"']+)[\"']", pyproject_text)
          if not pyproject_match:
            raise SystemExit("Could not find project version in pyproject.toml")
          checks["pyproject.toml"] = pyproject_match.group(1)

          library_properties = pathlib.Path("library.properties").read_text().splitlines()
          for line in library_properties:
            if line.startswith("version="):
              checks["library.properties"] = line.split("=", 1)[1].strip()
              break
          else:
            raise SystemExit("Could not find version in library.properties")

          checks["library.json"] = json.loads(pathlib.Path("library.json").read_text())["version"]

          mismatches = {
            path: actual
            for path, actual in checks.items()
            if actual != expected
          }
          if mismatches:
            for path, actual in mismatches.items():
              print(f"{path}: expected {expected}, found {actual}", file=sys.stderr)
            raise SystemExit("Release tag version does not match package metadata")

          print(f"Validated release version {expected}")
          PY

      - name: Configure
        run: cmake --preset host-linux-release

      - name: Build
        run: cmake --build --preset host-linux-release --parallel

      - name: Test
        run: ctest --preset host-linux-release

      - name: Install to staging
        run: |
          cmake --install build/host-linux-release \
            --prefix "${{ github.workspace }}/staging"

      - name: Consumer smoke test
        run: |
          mkdir -p build/smoke
          cat > build/smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ezo_driver_smoke C)
          find_package(ezo_driver CONFIG REQUIRED)
          add_executable(smoke main.c)
          target_link_libraries(smoke PRIVATE ezo::ezo_core)
          EOF
          cat > build/smoke/main.c <<'EOF'
          #include <ezo.h>
          #include <ezo_i2c.h>
          int main(void) { return 0; }
          EOF
          cmake -S build/smoke -B build/smoke/out \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging"
          cmake --build build/smoke/out --parallel

      - name: Package binary artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="ezo-driver-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "${ARTIFACT}" -C "${{ github.workspace }}/staging" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Package source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="ezo-driver-${VERSION}/" \
            -o "ezo-driver-${VERSION}-source.tar.gz" \
            HEAD

      - name: Generate checksums
        run: sha256sum ezo-driver-*.tar.gz > SHA256SUMS

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${{ steps.package.outputs.artifact }}"
          SHA=$(grep "${ARTIFACT}" SHA256SUMS | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "feastorg/ezo-driver" \
            --arg component "ezo_driver" \
            --arg version "${VERSION}" \
            --arg platform "linux-x86_64" \
            --arg asset "${ARTIFACT}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, platform: $platform, asset: $asset, sha256: $sha256}' \
            > manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ezo-driver-*.tar.gz
            SHA256SUMS
            manifest.json
          generate_release_notes: true
