name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds the Python sdist and wheels as workflow artifacts, so a wheel can
  # be tried on a Pi before a tag is cut. Nothing is published or released.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate version metadata
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          expected = os.environ["RELEASE_VERSION"]
          checks = {}

          cmake_text = pathlib.Path("CMakeLists.txt").read_text()
          cmake_match = re.search(r"project\s*\([\s\S]*?\bVERSION\s+([^\s\)]+)", cmake_text)
          if not cmake_match:
            raise SystemExit("Could not find project VERSION in CMakeLists.txt")
          checks["CMakeLists.txt"] = cmake_match.group(1)

          pyproject_text = pathlib.Path("pyproject.toml").read_text()
          pyproject_match = re.search(r"(?m)^version\s*=\s*[\"']([^\"']+)[\"']", pyproject_text)
          if not pyproject_match:
            raise SystemExit("Could not find project version in pyproject.toml")
          checks["pyproject.toml"] = pyproject_match.group(1)

          library_properties = pathlib.Path("library.properties").read_text().splitlines()
          for line in library_properties:
            if line.startswith("version="):
              checks["library.properties"] = line.split("=", 1)[1].strip()
              break
          else:
            raise SystemExit("Could not find version in library.properties")

          checks["library.json"] = json.loads(pathlib.Path("library.json").read_text())["version"]

          mismatches = {
            path: actual
            for path, actual in checks.items()
            if actual != expected
          }
          if mismatches:
            for path, actual in mismatches.items():
              print(f"{path}: expected {expected}, found {actual}", file=sys.stderr)
            raise SystemExit("Release tag version does not match package metadata")

          print(f"Validated release version {expected}")
          PY

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build and check the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  python-wheels:
    name: Python wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      # Configured in pyproject.toml under [tool.cibuildwheel]: one cp39-abi3
      # wheel per architecture, tested against the bindings tests inside the
      # manylinux container.
      - name: Build and test the wheel
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release-linux-x86_64:
    name: Release (linux-x86_64)
    needs: [validate-version, python-sdist, python-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential jq

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake --preset host-linux-release

      - name: Build
        run: cmake --build --preset host-linux-release --parallel

      - name: Test
        run: ctest --preset host-linux-release

      - name: Install to staging
        run: |
          cmake --install build/host-linux-release \
            --prefix "${{ github.workspace }}/staging"

      - name: Consumer smoke test
        run: |
          mkdir -p build/smoke
          cat > build/smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ezo_driver_smoke C)
          find_package(ezo_driver CONFIG REQUIRED)
          add_executable(smoke main.c)
          target_link_libraries(smoke PRIVATE ezo::ezo_core)
          EOF
          cat > build/smoke/main.c <<'EOF'
          #include <ezo.h>
          #include <ezo_i2c.h>
          int main(void) { return 0; }
          EOF
          cmake -S build/smoke -B build/smoke/out \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/staging"
          cmake --build build/smoke/out --parallel

      - name: Package binary artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="ezo-driver-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "${ARTIFACT}" -C "${{ github.workspace }}/staging" .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Package source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="ezo-driver-${VERSION}/" \
            -o "ezo-driver-${VERSION}-source.tar.gz" \
            HEAD

      - name: Download the Python sdist and wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: .
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ezo-driver-*.tar.gz ezo_driver-*.tar.gz ezo_driver-*.whl > SHA256SUMS

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${{ steps.package.outputs.artifact }}"
          SHA=$(grep "${ARTIFACT}" SHA256SUMS | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "feastorg/ezo-driver" \
            --arg component "ezo_driver" \
            --arg version "${VERSION}" \
            --arg platform "linux-x86_64" \
            --arg asset "${ARTIFACT}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, platform: $platform, asset: $asset, sha256: $sha256}' \
            > manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ezo-driver-*.tar.gz
            ezo_driver-*.tar.gz
            ezo_driver-*.whl
            SHA256SUMS
            manifest.json
          generate_release_notes: true

  # Trusted Publishing: PyPI trusts this workflow file, the pypi environment
  # and this repository. The job uploads only the sdist and the wheels.
  publish:
    name: Publish to PyPI
    needs: [validate-version, python-sdist, python-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ezo-driver
    permissions:
      id-token: write

    steps:
      - name: Download the Python sdist and wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
